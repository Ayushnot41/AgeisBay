name: AegisBay Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    name: Enclave Mediator & Cryptographic Hard Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch Mediator Daemon
        run: |
          python -m services.mediator.app &
          sleep 4

      - name: Execute 13-Point Comprehensive Platform Audit
        run: |
          python harness/comprehensive_audit.py

      - name: Execute Enclave Unit Tests
        run: |
          pytest harness/ -v

  frontend-build:
    name: Next.js Web Console Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm install

      - name: Build Next.js Production Bundle
        working-directory: web
        run: npm run build
