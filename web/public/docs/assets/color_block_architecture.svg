<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" style="background:#080C14; border:1px solid #1E293B; border-radius:8px;">
  <!-- Header Title -->
  <rect x="0" y="0" width="960" height="36" fill="#0F172A" rx="8"/>
  <text x="20" y="23" font-family="monospace" font-size="12" fill="#38BDF8" font-weight="700">AEGISBAY COLOR-CODED ZERO-TRUST ARCHITECTURE BLOCK DIAGRAM</text>
  <text x="940" y="23" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="end">RFC 8785 • ISO/IEC 27001 ALIGNED</text>

  <!-- Block 1: Red Subnet (Red Block) -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="200" height="195" rx="6" fill="#1C1014" stroke="#EF4444" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#7F1D1D"/>
    <text x="100" y="19" font-family="monospace" font-size="11" fill="#FEF2F2" text-anchor="middle" font-weight="700">RED WORKSPACE</text>
    <text x="100" y="50" font-family="monospace" font-size="10" fill="#F87171" text-anchor="middle" font-weight="600">Subnet: 172.28.1.0/24</text>
    <rect x="15" y="65" width="170" height="24" rx="4" fill="#2A141A" stroke="#EF4444" stroke-width="0.8"/>
    <text x="100" y="81" font-family="monospace" font-size="8.5" fill="#FECACA" text-anchor="middle">cap_drop: [ALL]</text>
    <rect x="15" y="95" width="170" height="24" rx="4" fill="#2A141A" stroke="#EF4444" stroke-width="0.8"/>
    <text x="100" y="111" font-family="monospace" font-size="8.5" fill="#FECACA" text-anchor="middle">cgroups v2: 512MB RAM</text>
    <rect x="15" y="125" width="170" height="24" rx="4" fill="#2A141A" stroke="#EF4444" stroke-width="0.8"/>
    <text x="100" y="141" font-family="monospace" font-size="8.5" fill="#FECACA" text-anchor="middle">Commitment: H(Salt||P)</text>
    <rect x="15" y="155" width="170" height="24" rx="4" fill="#2A141A" stroke="#EF4444" stroke-width="0.8"/>
    <text x="100" y="171" font-family="monospace" font-size="8.5" fill="#FECACA" text-anchor="middle">No Egress to Blue Subnet</text>
  </g>

  <!-- Arrow Red to Mediator -->
  <path d="M 225 152 L 285 152" stroke="#06B6D4" stroke-width="2.5"/>
  <polygon points="285,152 273,146 273,158" fill="#06B6D4"/>
  <text x="255" y="142" font-family="monospace" font-size="8" fill="#38BDF8" text-anchor="middle">AES-GCM</text>

  <!-- Block 2: Mediator Enclave (Cyan / Blue Block) -->
  <g transform="translate(290, 55)">
    <rect x="0" y="0" width="250" height="195" rx="6" fill="#081424" stroke="#0284C7" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#0369A1"/>
    <text x="125" y="19" font-family="monospace" font-size="11" fill="#F0F9FF" text-anchor="middle" font-weight="700">TRUSTED MEDIATOR ENCLAVE</text>
    <text x="125" y="48" font-family="monospace" font-size="9.5" fill="#38BDF8" text-anchor="middle" font-weight="600">Subnet: 172.28.3.0/24</text>
    <rect x="15" y="60" width="220" height="24" rx="4" fill="#0C2038" stroke="#0284C7" stroke-width="0.8"/>
    <text x="125" y="76" font-family="monospace" font-size="8.5" fill="#BAE6FD" text-anchor="middle">Volatile RAM Envelope (Zero Disk)</text>
    <rect x="15" y="88" width="220" height="24" rx="4" fill="#0C2038" stroke="#0284C7" stroke-width="0.8"/>
    <text x="125" y="104" font-family="monospace" font-size="8.5" fill="#BAE6FD" text-anchor="middle">1000.0ms Constant-Time Release</text>
    <rect x="15" y="116" width="220" height="24" rx="4" fill="#0C2038" stroke="#0284C7" stroke-width="0.8"/>
    <text x="125" y="132" font-family="monospace" font-size="8.5" fill="#BAE6FD" text-anchor="middle">6-Point Kernel Invariant Verification</text>
    <rect x="15" y="144" width="220" height="38" rx="4" fill="#063228" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="159" font-family="monospace" font-size="8.5" fill="#6EE7B7" text-anchor="middle" font-weight="700">TINYFISH AUTONOMOUS SENTINEL</text>
    <text x="125" y="174" font-family="monospace" font-size="8" fill="#A7F3D0" text-anchor="middle">Egress Probe: CONTAINED (0 bytes)</text>
  </g>

  <!-- Arrow Blue to Mediator -->
  <path d="M 605 152 L 545 152" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="545,152 557,146 557,158" fill="#3B82F6"/>
  <text x="575" y="142" font-family="monospace" font-size="8" fill="#60A5FA" text-anchor="middle">Policy</text>

  <!-- Block 3: Blue Subnet (Blue Block) -->
  <g transform="translate(610, 55)">
    <rect x="0" y="0" width="180" height="195" rx="6" fill="#0B1322" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#1D4ED8"/>
    <text x="90" y="19" font-family="monospace" font-size="11" fill="#EFF6FF" text-anchor="middle" font-weight="700">BLUE WORKSPACE</text>
    <text x="90" y="50" font-family="monospace" font-size="10" fill="#93C5FD" text-anchor="middle" font-weight="600">Subnet: 172.28.2.0/24</text>
    <rect x="12" y="65" width="156" height="24" rx="4" fill="#13223E" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="90" y="81" font-family="monospace" font-size="8.5" fill="#BFDBFE" text-anchor="middle">Target Model Defense</text>
    <rect x="12" y="95" width="156" height="24" rx="4" fill="#13223E" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="90" y="111" font-family="monospace" font-size="8.5" fill="#BFDBFE" text-anchor="middle">Frozen Hash Policy H(P)</text>
    <rect x="12" y="125" width="156" height="24" rx="4" fill="#13223E" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="90" y="141" font-family="monospace" font-size="8.5" fill="#BFDBFE" text-anchor="middle">Blinded Test Isolation</text>
    <rect x="12" y="155" width="156" height="24" rx="4" fill="#13223E" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="90" y="171" font-family="monospace" font-size="8.5" fill="#BFDBFE" text-anchor="middle">No Pre-test Plaintext</text>
  </g>

  <!-- Arrow Mediator to Merkle Proof -->
  <path d="M 795 152 L 820 152" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="820,152 810,146 810,158" fill="#10B981"/>

  <!-- Block 4: Merkle Ledger & Verifier (Emerald Green Block) -->
  <g transform="translate(825, 55)">
    <rect x="0" y="0" width="115" height="195" rx="6" fill="#061814" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="115" height="28" rx="6" fill="#047857"/>
    <text x="57" y="19" font-family="monospace" font-size="10.5" fill="#ECFDF5" text-anchor="middle" font-weight="700">MERKLE ROOT</text>
    <text x="57" y="50" font-family="monospace" font-size="8.5" fill="#A7F3D0" text-anchor="middle">RFC 8785</text>
    <text x="57" y="70" font-family="monospace" font-size="8" fill="#6EE7B7" text-anchor="middle">Leaf 1: Config</text>
    <text x="57" y="90" font-family="monospace" font-size="8" fill="#6EE7B7" text-anchor="middle">Leaf 2: Checks</text>
    <text x="57" y="110" font-family="monospace" font-size="8" fill="#6EE7B7" text-anchor="middle">Leaf 3: Result</text>
    <text x="57" y="130" font-family="monospace" font-size="8" fill="#6EE7B7" text-anchor="middle">Leaf 4: Status</text>
    <rect x="10" y="150" width="95" height="30" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
    <text x="57" y="164" font-family="monospace" font-size="8.5" fill="#A7F3D0" text-anchor="middle" font-weight="700">Ed25519</text>
    <text x="57" y="174" font-family="monospace" font-size="7.5" fill="#6EE7B7" text-anchor="middle">CLI Verified</text>
  </g>
</svg>
